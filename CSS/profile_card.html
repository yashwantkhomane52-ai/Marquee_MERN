<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #img1 {
        border: 3px solid #fbfbfb;
        width: 100px;
        height: 100px;
        border-radius: 50%;
        position: absolute;
        /* align-items: center; */
        left: 35%;
        top: 30%;
      }
      #social {
        height: 30px;
        width: 30px;
        /* border: 1px solid #000000; */
        object-fit: cover;
        border-radius: 50%;
        gap: 10px;
      }
      #social1 {
        height: 30px;
        width: 30px;
        /* border: 1px solid #000000; */
        object-fit: cover;
      }
      #social2 {
        height: 30px;
        width: 30px;
        /* border: 1px solid #000000; */
        object-fit: cover;
      }
      #social3 {
        height: 30px;
        width: 30px;
        /* border: 1px solid #000000; */
        object-fit: cover;
      }
      #social:hover {
        transform: scale(1.05);
        transition: 0.5s;
        box-shadow: 0px 0px 10px #030bf5;
      }
      #social1:hover {
        transform: scale(1.05);
        transition: 0.5s;
        box-shadow: 0px 0px 10px #030bf5;
      }
      #social2:hover {
        transform: scale(1.05);
        transition: 0.5s;
        box-shadow: 0px 0px 10px #030bf5;
      }
      #social3:hover {
        transform: scale(1.05);
        transition: 0.5s;
        box-shadow: 0px 0px 10px #030bf5;
      }
      .socials {
        text-align: center;
        padding: 10px;
        position: absolute;
        top: 55%;
        width: 100%;
        display: flex;
        gap: 10px;
        justify-content: center;
      }
      .profile {
        text-align: center;
        position: absolute;
        background-color: blue;
        width: 100%;
        height: 30%;
        align-items: center;
        justify-content: center;
      }
      .detail {
        text-align: center;
        position: absolute;
        top: 30%;
        width: 100%;
      }
      .btn {
        text-align: center;
        padding: 10px;
        position: absolute;
        top: 72%;
        width: 100%;
      }
      .like {
        text-align: center;
        position: absolute;
        top: 90%;
        width: 100%;
      }
      #profile-card {
        background-color: rgb(247, 247, 249);
        position: relative;
        width: 380px;
        height: 400px;

        border-radius: 10px;
      }

      input[type="button"] {
        border: none;
        color: white;
        padding: 10px 20px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        margin: 4px 2px;
        cursor: pointer;
        border-radius: 50px;
      }
    </style>
  </head>
  <body>
    <section id="profile-card">
      <div class="profile">
        <img
          id="img1"
          src="https://media.licdn.com/dms/image/v2/D4D03AQFTX5i43dOMkw/profile-displayphoto-crop_800_800/B4DZ5zfmT0IMAI-/0/1780054125783?e=1785369600&v=beta&t=cc1srSSFOO3jI3BV3BszkQgER_SR5UB-LJIwsrdQ4sw"
          alt=" not found"
        />
      </div>
      <div class="detail">
        <h1>CodingLab</h1>
        <p>YouTuber & Blogger</p>
      </div>
      <div class="socials">
        <a href="https://www.instagram.com/" target="_blank">
          <img
            id="social"
            src="https://cdn-icons-png.flaticon.com/128/15713/15713420.png"
          />
        </a>
        <a href="https://www.facebook.com/" target="_blank">
          <img
            id="social1"
            src="https://cdn-icons-png.flaticon.com/128/5968/5968764.png"
          />
        </a>
        <a href="https://www.twitter.com/" target="_blank">
          <img
            id="social2"
            src="https://cdn-icons-png.flaticon.com/128/5969/5969020.png"
          />
        </a>
        <a href="https://www.whatsapp.com/" target="_blank">
          <img
            id="social3"
            src="https://cdn-icons-png.flaticon.com/128/15707/15707820.png"
          />
        </a>
      </div>

      <div class="btn">
        <input
          type="button"
          value="SUBSCRIBE"
          id="SUB"
          style="background-color: #6568d2"
        />
        <input
          type="button"
          value="Message"
          id="Msg"
          style="background-color: rgb(111, 111, 213)"
          height="50"
          width="100"
        />
      </div>

      <div class="like">
        <img
          height="15"
          width="15"
          src="https://cdn-icons-png.flaticon.com/128/1077/1077035.png"
          alt="Heart"
        />
        60.k |
        <img
          src="https://cdn-icons-png.flaticon.com/128/9256/9256389.png"
          alt="msg"
          height="15"
          width="15"
        />
        20K |
        <img
          src="https://cdn-icons-png.flaticon.com/128/2099/2099085.png"
          alt="share"
          height="15"
          width="15"
        />
        12.4K
      </div>
    </section>
  </body>
</html>
