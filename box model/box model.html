<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    p {
      background-color: lightblue;
      border: solid 10px;
      padding: 30px;
    }
    h1 {
      background-color: palevioletred;
      padding: 15px;
      border: solid 5px;
      border-color: black;
    }
    li {
      color: rosybrown;
    }
    .format {
      background-color: yellow;
    }
    /* div p {
      display: inline-block;
      padding: 10px;
      border1
    } */
    span {
      border: 10px solid black;
      background-color: white;
      padding: 30px;
      margin: 10px;
    }
  </style>
  <body>
    <h1>BOX Model</h1>
    <p>
      Every element on the page has its own box, which can be styled using CSS.
    </p>
    <p>From the inside out.</p>
    <ul>
      <li class="format">content</li>
      <li>padding</li>
      <li class="format">border</li>
      <li>margin</li>
    </ul>
    <h2>Background</h2>
    <div>
      <p>
        keep in mind that a <span>background</span> will cover the content and
        the padding.
      </p>
    </div>
  </body>
</html>
